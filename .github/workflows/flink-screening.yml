# 友链申请 AI 初筛：抓取申请站点 → Ollama(qwen3.5) 按规则分析 → 回写新 Go 后端。
#
# 从 ariablognext-backend/.github/workflows/flink-screening.yml 迁移（2026-10-28）。
# 迁移差异只有两处（抓取与模型逻辑原样保留在 scripts/flink_screening.py）：
#   1. 回写端点：旧 POST /flink/screening → 新 POST /links/applications/screening；
#   2. 鉴权：旧 X-Screening-Secret 头 → 新 X-Internal-Token 头（值仍是同一个 SECRET）。
#
# 触发方式：
# - 后端收到友链申请后发 repository_dispatch(event_type=flink-screening)；
#   ⚠️ 后端 config.yml 的 flink.screening.repo 已写死为本仓库
#   （LYXOfficial/ariablognext-backend-go），eventType 必须与下面 on.types 一致。
# - 手动 workflow_dispatch（填 app_id + site_url，便于测试单个申请）。
#
# 仓库 Settings 需要配置：
# - Secret: SECRET（与后端 SECRET 同值，复用同一个值即可）
# - Variable: BACKEND_URL（可选，默认新后端直连 https://neoend.yaria.top；
#   若走 glue 旧域名则填 https://blognext-end.yaria.top —— 但 glue 的 /flink/screening
#   是旧契约翻译，直连新后端语义更清晰）
#
# 模型速度说明：免费 runner 是 2 核 CPU，实测 qwen3.5:9b 的 16k 上下文
# prompt 评估要 3 分钟以上、整轮容易撞 20 分钟超时，默认用 qwen3.5:4b。

name: 友链申请初筛

on:
  repository_dispatch:
    types: [flink-screening]
  workflow_dispatch:
    inputs:
      app_id:
        description: 友链申请记录 ID
        required: true
      site_url:
        description: 申请站点地址
        required: true
      site_name:
        description: 申请的网站名称
        required: false
      site_descr:
        description: 申请的网站描述
        required: false

# 同一申请重复触发时排队执行，避免两轮初筛交错回写
concurrency:
  group: flink-screening-${{ github.event.client_payload.id || github.event.inputs.app_id }}
  cancel-in-progress: false

jobs:
  screening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装无头浏览器（客户端渲染站点兜底）
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 安装并启动 Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/ && break
            sleep 2
          done

      - name: 拉取模型
        env:
          OLLAMA_MODEL: qwen3.5:4b
        run: ollama pull "$OLLAMA_MODEL"

      - name: 抓取站点并初筛
        env:
          OLLAMA_MODEL: qwen3.5:4b
          APP_ID: ${{ github.event.client_payload.id || github.event.inputs.app_id }}
          SITE_URL: ${{ github.event.client_payload.url || github.event.inputs.site_url }}
          SITE_NAME: ${{ github.event.client_payload.name || github.event.inputs.site_name }}
          SITE_DESCR: ${{ github.event.client_payload.descr || github.event.inputs.site_descr }}
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://neoend.yaria.top' }}
          SECRET: ${{ secrets.SECRET }}
          # 中国时区：模型判断「是否最近在更新」要按本站读者的日期基准
          TZ: Asia/Shanghai
        run: python scripts/flink_screening.py "$APP_ID" "$SITE_URL" "$SITE_NAME" "$SITE_DESCR"
