# 语义搜索向量回填（定时增量）：跑 scripts/build_embeddings.py。
#
# 为什么是一个独立 Python 脚本而不是 Go 命令：
#   - Go 版要过 config.yml 的启动校验，会被逼着配齐 S3/SMTP/GitHub 等
#     十几个根本用不到的密钥（「变量未定义 = 拒绝启动」）；
#   - Python 直接读库、调嵌入 API、写 PostEmbeddings，所需配置只有 2 个环境变量
#     （库名与模型/endpoint 一样是常量，写在脚本里）。
#
# 增量判定：文档里的 textHash 与当前源文本的 sha256 不同（或 model/dim 不匹配、
# 或缺失）才重算。源文本优先用服务端维护的 searchText，没有则从 mdContent 轻量清洗。
#
# ⚠️ Atlas 若开了 IP 白名单，需要放行 GitHub Actions（或 0.0.0.0/0）。

name: Build Embeddings (scheduled backfill)

on:
  schedule:
    - cron: "37 */6 * * *" # 每 6 小时；错开整点（备份/朋友圈爬取都在整点附近）
  workflow_dispatch:
    inputs:
      force:
        description: 忽略 textHash 全量重算（换模型后用）
        type: boolean
        default: false

concurrency:
  group: build-embeddings
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install "pymongo[srv]" certifi

      - name: Run incremental backfill
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SF_TOKEN: ${{ secrets.SF_TOKEN }}
        run: |
          python scripts/build_embeddings.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}
